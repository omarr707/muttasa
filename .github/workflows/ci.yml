name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: الحزم
        run: |
          flutter pub get
          (cd packages/schedule_core && dart pub get)

      - name: التحليل
        run: |
          flutter analyze
          (cd packages/schedule_core && dart analyze)

      - name: اختبارات المحرك
        working-directory: packages/schedule_core
        run: dart test

      - name: اختبارات التطبيق
        run: flutter test --exclude-tags screens

      - name: بناء APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/muttasa.apk

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: muttasa-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: نشر نسخة تجريبية للجوال
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-${{ github.ref_name == 'main' && 'main' || 'phase1' }}
          name: مُتَّسَع — نسخة تجريبية (${{ github.ref_name }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            نسخة تجريبية للأندرويد من آخر تحديث على الفرع `${{ github.ref_name }}` (${{ github.sha }}).
            حمّل ملف APK من الأسفل وثبّته على الجوال.
          files: build/app/outputs/flutter-apk/muttasa.apk
