name: muttasa
description: "مُتَّسَع — روتينك اليومي. رتّب يومك، وخلّ فيه وقت للناس اللي يهمّونك."
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  schedule_core:
    path: packages/schedule_core

  intl: any
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.0
  drift: ^2.30.0
  sqlite3: ^3.0.0
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_secure_storage: ^11.0.0
  flutter_local_notifications: ^23.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.0
  hijri: ^3.0.1
  share_plus: ^13.0.0
  file_picker: ^13.0.0
  uuid: ^4.5.0
  url_launcher: ^6.3.3
  geolocator: ^14.1.2
  flutter_native_contact_picker: ^0.0.13
  device_calendar_plus: ^0.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.30.0
  build_runner: ^2.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/defaults/
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro.ttf

# قاعدة مشفّرة: SQLite3MultipleCiphers عبر hooks في package:sqlite3.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
